services:
  backend:
    build: ./backend
    container_name: scanner-backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - scanner-db:/app/data
    environment:
      - DB_PATH=/app/data/scanner.db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: scanner-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  scanner-db:
